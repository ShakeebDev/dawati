name: dawati
description: دعوتي – نظام الدعوات الذكية | Smart Digital Invitation System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.2

  # Supabase Backend
  supabase_flutter: ^2.5.3

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Image Handling
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  image: ^4.2.0
  path_provider: ^2.1.3
  share_plus: ^12.0.1

  # Utils
  uuid: ^4.4.0
  intl: ^0.20.2
  crypto: ^3.0.7
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  vibration: ^2.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  collection: ^1.18.0

  # CSV & File Handling
  csv: ^6.0.0
  file_picker: ^10.3.10
  flutter_contacts: ^1.1.9+2

  # Local Storage
  shared_preferences: ^2.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Charts
  fl_chart: ^0.68.0

  # Pagination
  infinite_scroll_pagination: ^4.0.0

  cupertino_icons: ^1.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^10.3.0
  sqflite_sqlcipher: ^3.4.0
  dart_jsonwebtoken: ^3.4.1
  retry: ^3.1.2
  dartz: ^0.10.1
  device_info_plus: ^11.5.0
  workmanager: ^0.9.0+3
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/images/app_icon.png
  android: true
  ios: false
  fullscreen: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png
